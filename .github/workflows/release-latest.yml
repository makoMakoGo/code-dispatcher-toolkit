name: release-latest

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

concurrency:
  group: release-latest
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.3

      - name: Setup Go
        uses: actions/setup-go@v6.4.0
        with:
          go-version-file: code-dispatcher/go.mod
          cache: false

      - name: Run verification gate
        run: bash scripts/verify.sh

      - name: Build cross-platform binaries
        run: bash scripts/build-dist.sh

      - name: Generate checksums
        run: |
          cd dist
          sha256sum code-dispatcher-* > SHA256SUMS

      - name: Generate artifact attestations
        uses: actions/attest@v4.1.0
        with:
          subject-path: |
            dist/code-dispatcher-*
            dist/SHA256SUMS

      - name: Force-update latest tag to current commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f latest "${GITHUB_SHA}"
          git push origin refs/tags/latest --force

      - name: Publish rolling latest release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest \
              dist/code-dispatcher-* \
              dist/SHA256SUMS \
              --clobber
            gh release edit latest \
              --title "code-dispatcher latest" \
              --notes "Rolling latest build from main commit ${GITHUB_SHA}" \
              --latest
          else
            gh release create latest \
              dist/code-dispatcher-* \
              dist/SHA256SUMS \
              --title "code-dispatcher latest" \
              --notes "Rolling latest build from main commit ${GITHUB_SHA}" \
              --latest
          fi
