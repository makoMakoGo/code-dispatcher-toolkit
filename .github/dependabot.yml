version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/code-dispatcher"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 30
    groups:
      go-modules:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 30
    groups:
      github-actions:
        patterns:
          - "*"
